# Reference nginx config for dev.ichem.kz
# ---------------------------------------------------------------------------
# Не подключается автоматически: скопируйте/сверьте с vhost панели (ISPmanager и т.п.).
# Исправления относительно старого варианта:
#   - /home/: используется root + public (файлы SPA лежат в .../public/home/, как при rsync dist/)
#   - убран alias .../home/dist/ (деплой идёт в public/home/, не в public/home/dist/)
#   - убрана связка alias + try_files /home/index.html (типичные 500/циклы в nginx)
# ---------------------------------------------------------------------------

# --- HTTP: редирект на HTTPS (и место под ACME, если понадобится без панели) ---
server {
	listen 195.49.210.92:80;
	server_name dev.ichem.kz;

	# Раскомментируйте, если выпускаете сертификат через HTTP-01 и редирект мешает:
	# location ^~ /.well-known/acme-challenge/ {
	#     root /var/www/www-root/data/www/dev.ichem.kz;
	# }

	return 301 https://$host$request_uri;
}

# --- HTTPS: основной сервер ---
server {
	listen 195.49.210.92:443 ssl;
	server_name dev.ichem.kz;

	ssl_certificate "/var/www/httpd-cert/www-root/dev.ichem.kz_le3.crtca";
	ssl_certificate_key "/var/www/httpd-cert/www-root/dev.ichem.kz_le3.key";
	ssl_ciphers EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
	ssl_prefer_server_ciphers on;
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
	ssl_dhparam /etc/ssl/certs/dhparam4096.pem;

	charset off;
	index index.php index.html;

	disable_symlinks if_not_owner from=$root_path;

	include /etc/nginx/vhosts-includes/*.conf;
	include /etc/nginx/vhosts-resources/dev.ichem.kz/*.conf;

	access_log /var/www/httpd-logs/dev.ichem.kz.access.log;
	error_log /var/www/httpd-logs/dev.ichem.kz.error.log notice;

	ssi on;

	set $root_path /var/www/www-root/data/www/dev.ichem.kz;
	root $root_path;

	gzip on;
	gzip_comp_level 5;
	gzip_disable "msie6";
	gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;

	# Внешний сайт (React / Vite): статика в .../public/home/ (содержимое dist после CI)
	location ^~ /home/ {
		root /var/www/www-root/data/www/dev.ichem.kz/public;
		index index.html;
		try_files $uri $uri/ /home/index.html;
		access_log /var/log/nginx/home_access.log;
	}

	# Корень домена → витрина
	location = / {
		return 302 /home/;
	}

	# Вход в CRM / внутреннюю систему — явно на Apache (8082), без try_files.
	# Если /login по-прежнему 404, проблема в Apache/PHP (DocumentRoot, rewrite, baseURL), не в nginx.
	location ^~ /login {
		include /etc/nginx/vhosts-resources/dev.ichem.kz/dynamic/*.conf;
		proxy_pass http://127.0.0.1:8082;
		proxy_redirect http://127.0.0.1:8082 /;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Port $server_port;
	}

	# Внутреннее PHP-приложение через прокси
	location / {
		location ~ [^/]\.ph(p\d*|tml)$ {
			try_files /does_not_exists @fallback;
		}

		location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpe?g|avi|zip|gz|bz2?|rar|swf|webp|woff|woff2)$ {
			expires 24h;
			try_files $uri $uri/ @fallback;
		}

		try_files /does_not_exists @fallback;
	}

	location @fallback {
		include /etc/nginx/vhosts-resources/dev.ichem.kz/dynamic/*.conf;
		proxy_pass http://127.0.0.1:8082;
		proxy_redirect http://127.0.0.1:8082 /;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Port $server_port;
		access_log off;
	}

	include /etc/nginx/modules-includes/phpcomposer/*.conf;
	include /etc/nginx/users-resources/www-root/*.conf;
}
